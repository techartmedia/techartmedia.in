<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tamOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="tamBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="200" height="200" rx="42" fill="#09090b" />
  
  <!-- Stylized Geometric Mark: T-A-M Dynamic Overlap -->
  <g transform="translate(25, 25) scale(0.75)" filter="url(#subtleShadow)">
    <!-- Orange Left Wing (Creativity / Art) -->
    <path d="M20 45 C35 25 75 15 100 15 V85 C75 85 45 75 20 45 Z" fill="url(#tamOrangeGrad)" />
    <path d="M15 65 C35 50 75 45 100 50 V115 C70 115 40 100 15 65 Z" fill="#f97316" opacity="0.95" />
    
    <!-- Blue Right Wing (Technology / Code) -->
    <path d="M100 15 C135 15 170 28 185 52 C160 75 130 85 100 85 V15 Z" fill="url(#tamBlueGrad)" />
    <path d="M100 85 H145 L125 185 H85 L100 85 Z" fill="#0284c7" />
    
    <!-- Center Core Dot / Focus -->
    <circle cx="100" cy="85" r="14" fill="#ffffff" />
    <circle cx="100" cy="85" r="7" fill="#ea580c" />
  </g>
</svg>
